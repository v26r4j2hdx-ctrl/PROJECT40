<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | LIBRARY.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f3ed;
            color: #292722;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 950px;
            min-height: 570px;
            background: #fffdf8;
            display: grid;
            grid-template-columns: 42% 58%;
            border: 1px solid #ddd7cc;
            box-shadow: 0 20px 50px rgba(50, 43, 32, 0.10);
        }

        .left {
            background: #e9e2d6;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .left h1 {
            font-family: Georgia, serif;
            font-size: 48px;
            line-height: 1.05;
            font-weight: normal;
            margin: 0 0 20px;
        }

        .left p {
            color: #6d665c;
            line-height: 1.7;
            font-size: 15px;
            max-width: 310px;
        }

        .quote {
            font-family: Georgia, serif;
            font-style: italic;
            color: #756d61;
            font-size: 14px;
        }

        .right {
            padding: 55px 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .top h2 {
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: normal;
            margin: 0;
        }

        .top a {
            color: #655a4c;
            text-decoration: none;
            font-size: 14px;
        }

        .top a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #514b43;
            letter-spacing: 0.5px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d5cec2;
            background: #fff;
            color: #292722;
            font-size: 15px;
            outline: none;
            border-radius: 2px;
        }

        input:focus,
        select:focus {
            border-color: #8d7b63;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            background: #403a32;
            color: white;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button:hover {
            background: #29251f;
        }

        #message {
            min-height: 20px;
            margin-top: 18px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            color: #a33d32;
        }

        .success {
            color: #47704d;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: #756b5d;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 750px) {
            .card {
                grid-template-columns: 1fr;
            }

            .left {
                min-height: 280px;
                padding: 35px;
            }

            .left h1 {
                font-size: 38px;
            }

            .right {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="left">

            <div class="logo">LIBRARY.</div>

            <div>
                <h1>Begin your<br>library journey.</h1>

                <p>
                    Create your library account and access books,
                    reservations, borrowing information and fine details
                    from one place.
                </p>
            </div>

            <div class="quote">
                “A library is a place where ideas begin.”
            </div>

        </div>


        <div class="right">

            <div class="top">
                <h2>Create Account</h2>

                <a href="login.html">
                    Already have an account?
                </a>
            </div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="username">
                        USERNAME
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="memberType">
                        MEMBER TYPE
                    </label>

                    <select id="memberType" required>

                        <option value="">
                            Select member type
                        </option>

                        <option value="Student">
                            Student
                        </option>

                        <option value="Faculty">
                            Faculty
                        </option>

                    </select>

                </div>


                <button type="submit">
                    CREATE ACCOUNT
                </button>

            </form>


            <div id="message"></div>


            <div class="back">
                <a href="login.html">
                    ← Back to Sign In
                </a>
            </div>

        </div>

    </div>

</div>


<script>

    document
        .getElementById("signupForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const memberType =
                document.getElementById("memberType").value;

            const message =
                document.getElementById("message");


            message.className = "";
            message.textContent = "Creating account...";


            try {

                const response = await fetch(
                    "http://localhost:8080/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            "username=" +
                            encodeURIComponent(username) +
                            "&password=" +
                            encodeURIComponent(password) +
                            "&memberType=" +
                            encodeURIComponent(memberType)
                    }
                );


                const result =
                    await response.text();


                if (response.ok) {

                    localStorage.setItem(
                        "libraryUsername",
                        username
                    );

                    localStorage.setItem(
                        "libraryMemberType",
                        memberType
                    );

                    message.className = "success";

                    message.textContent =
                        "Account created successfully!";


                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 1000);

                } else {

                    message.className = "error";

                    message.textContent =
                        result || "Unable to create account.";

                }

            } catch (error) {

                message.className = "error";

                message.textContent =
                    "Cannot connect to the library server. Make sure the Java server is running.";

            }

        });

</script>

</body>
</html>
